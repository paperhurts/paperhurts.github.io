name: Deploy

# Builds paperhurts.dev and publishes it to GitHub Pages. The build asks
# GitHub for every public repo tagged "paperhurts-dev", so a newly tagged
# project shows up on the next run: on push, daily, or on demand with
#   gh workflow run deploy.yml -R paperhurts/paperhurts.github.io

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build (with the current list of tagged repos)
        run: node scripts/build.mjs --fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
